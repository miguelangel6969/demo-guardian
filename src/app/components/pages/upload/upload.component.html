<div class="card m-5">
  <!-- Título principal centrado -->
  <div class="text-2xl font-semibold text-slate-800 text-center mb-10">
    Cargue de Información – Facturas Electrónicas
  </div>

  <!-- Área de carga -->
  <div class="flex flex-col gap-4 mt-4">
    <!-- Selector de carpeta oculto -->
    <input
      type="file"
      id="folderInput"
      webkitdirectory
      hidden
      (change)="onFolderSelected($event)"
    />

    <!-- Ruta seleccionada mostrada como input -->
    <div>
      <label class="block mb-2 font-medium">Carpeta seleccionada:</label>
      <input
        type="text"
        [value]="selectedFolderName"
        readonly
        class="p-inputtext w-full"
        placeholder="Ninguna carpeta seleccionada"
      />
    </div>

    <!-- Botones de acción -->
    <div class="flex gap-4">
      <p-button
        type="button"
        label="Seleccionar ruta"
        styleClass="p-button-secondary"
        icon="pi pi-folder-open"
        (click)="triggerFolderInput()"
      ></p-button>

      <p-button
        type="button"
        label="Cargar facturas electrónicas"
        styleClass="p-button-primary"
        icon="pi pi-upload"
        (click)="onUploadInvoices()"
        [disabled]="!selectedFolder || selectedFolder.length === 0"
      ></p-button>
      @if (dummyData.length > 0){
      <p-button
        type="button"
        label="Procesar archivos"
        styleClass="p-button-primary"
        icon="pi pi-send"
        (click)="onUploadInvoices()"
        [disabled]="!selectedFolder || selectedFolder.length === 0"
      ></p-button>
      }
      <p-button
        type="button"
        label="Limpiar"
        styleClass="p-button-danger"
        icon="pi pi-times"
        (click)="onClearSelection()"
        [disabled]="!selectedFolder || selectedFolder.length === 0"
      ></p-button>

    </div>
  </div>

  @if (dummyData.length > 0){
    <!-- Tabla de datos dummy -->
    <div class="mt-6 ml-10 mr-10 mt-20">
      <p-table [value]="dummyData" class="p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th>Nombre Contenedor</th>
            <th>Estado</th>
            <th>Observaciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td>{{ row.nombreContenedor }}</td>
            <td><p-tag [value]="row.estado" [severity]="getSeverity(row.estado)" /></td>
            <td>{{ row.observaciones }}</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  }
</div>
